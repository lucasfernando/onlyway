<html>
<head>
  <title>Filtro de Lista</title>
</head>
<body>
  <h1>Filtro de Lista</h1>
  <div class="autocomplete" style="width:300px;">
  <input type="text" id="filtro" placeholder="Digite para filtrar...">
  <ul id="lista">
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
    <li>Item 4</li>
    <li>Item 5</li>
  </ul>
</div>
  <script>
    // Código JavaScript aqui
const filtro = document.getElementById('filtro');
const lista = document.getElementById('lista'); //ul
const itens = Array.from(document.querySelectorAll('#lista li')); //All li

filtro.addEventListener('input', () => {
  //contato com a lista do back
  const texto = filtro.value.toLowerCase();
  const itensFiltrados = itens.filter(item => item.textContent.toLowerCase().includes(texto));
  lista.innerHTML = '';
  itensFiltrados.forEach(item => lista.appendChild(item));
});
  </script>
</body>
</html>
